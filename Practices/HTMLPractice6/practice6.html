<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6 - Tables</title>

<style>

@font-face {
   font-family: Summer;
   src: url(fonts/SummerAdventure.eot);
   src: local('summer'), url('fonts/SummerAdventure.ttf'), format('truetype');
}

.center{
   text-align: center;
   margin: 0 auto;
   width: 90%;
}

.courses{
   background-color: #ccc;
   width: 25%;
}

th.days{
   background-color: #99ff66;
   width: 15%;
}

table{
   width: 90%;
   margin: 0 auto;
}

table, th, td{
   border: 5px solid black;
   border-collapse: separate;
   border-spacing: 10px;
   padding: 8px;
   border-radius: 10px;
}

caption{
   font-family: Summer;
   color: darkgreen;
   font-weight: bold;
   border-radius: 10px;
   border: 2px solid gray;
   height: 40px;
   text-align: center;
   font-size: 40px;
}
</style>
</head>
<body>
<div class="center">
   <table>
    <caption>My Class Schedule</caption>
    <colgroup class="courses"></colgroup>
    <colgroup class="days" span="5"></colgroup>
	<tr>
      <th>Courses</th>
      <th class="days">Monday</th>
      <th class="days">Tuesday</th>
      <th class="days">Wednesday</th>
      <th class="days">Thursday</th>
      <th class="days">Friday</th>
   </tr>
   <tr>
      <th>INFO 1120</th>
      <td>&nbsp;</td>
      <td>9 - 11</td>
      <td>&nbsp;</td>
      <td>9 - 11</td>
      <td rowspan="2">&nbsp;</td>
   </tr>
   <tr>
      <th>MATH 1010</th>
      <td colspan="4">12 - 1</td>
   </tr>
   <tr>
      <th>INFO 2420</th>
      <td colspan="5">Online Available 24/7</td>
   </tr>
   </table>
</div>



</body>
</html>
